name: Lonely Runner Lean certificate

on:
  push:
    branches: ["lonely-runner-lean4"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan and the pinned Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version

      - name: Resolve pinned dependencies
        run: lake update

      - name: Download mathlib cache
        run: lake exe cache get

      - name: Build all checked declarations
        run: lake build

      - name: Reject proof placeholders
        run: |
          if grep -R -n -E '(^|[^A-Za-z])(sorry|admit|axiom)([^A-Za-z]|$)' \
              lonely-runner-formal/LonelyRunner lonely-runner-formal/LonelyRunner.lean; then
            echo "Proof placeholder or custom axiom found"
            exit 1
          fi

      - name: Independent kernel verification
        env:
          LEAN_NUM_THREADS: "1"
        run: lake env leanchecker
